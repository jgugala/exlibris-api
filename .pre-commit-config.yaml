# Hooks run ruff from the project's venv, so versions always match uv.lock.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: conventional-commit
        name: conventional commit message
        entry: .claude/hooks/commit-msg.sh
        language: script
        stages: [commit-msg]
